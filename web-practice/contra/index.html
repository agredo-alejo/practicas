<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <div class="contenedor">
        <div class="titulo">
            <h1>Generador de contraseñas</h1>
        </div>
        <form action="" class="app" id="app">
            <div class="fila caracteres">
                <label for="numero-caracteres">Número de caracteres:</label>
                <div class="btn-caracteres">
                    <button class="btn" id="btn-restar">-</button>
                   <div class="input">
                        <input type="text" id="numero-caracteres" readonly value="12">
                   </div>
                    <button class="btn" id="btn-sumar">+</button>
                </div>
            </div>
            <div class="fila simbolos">
                <label for="simbolos">Incluir Símbolos?</label>
                <div class="btn-fila">
                    <button class="btn" id="simbolos">Si</button>
                </div>
            </div>
            <div class="fila numeros">
                <label for="">Incluir Números?</label>
                <div class="btn-fila">
                    <button class="btn" id="numeros">Si</button>
                </div>
            </div>
            <div class="fila mayusculas">
                <label for="">Incluir Mayúsculas?</label>
                <div class="btn-fila">
                    <button class="btn" id="mayusculas">Si</button>
                </div>
            </div>
            <div class="fila generar">
                <button class="btn btn-generar" id="generar">Generar</button>
                <input type="text" class="password" readonly id="input-password" value="sBkJ#LkK_3d3">
            </div>

        </form>
    </div>


    <script src="main.js"></script>
</body>
</html>
