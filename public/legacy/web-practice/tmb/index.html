<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="style.css">
    <title>TMB</title>
</head>
<body>
    <div class="contenedor">
        <center>
            <h1>Tasa metabolica basal</h1>
        </center>
       <div class="bloque">
           <span>Sexo: </span><br>
            <div class="check">
                <input type="radio" id="men" name="sexo" value="men"> 
                <label for="men">Hombre</label><br>
            </div>
            
            <input type="radio" id="woman" name="sexo" value="woman">
            <label for="woman">Mujer</label><br>
       </div>

        <div class="bloque">
            <span>Peso:</span><br>
            <div class="grid">
                <div>
                    <input type="number" id="peso" min="0"><br>
                </div>
                
               <div>
                    <select name="sistem" id="sistem">
                        <option value="kg">Kg</option>
                        <option value="lb">Lb</option>
                    </select><br>
               </div>
            </div>
            
        </div>
   <div class="bloque">
            <span>Estatura:</span><br>
            <div class="grid">
                <input type="number" id="altura" min="0">
                <select name="unidadesAltura" id="unidadesAltura">
                    <option value="cm">cm</option>
                    <option value="in">in</option>
                </select><br>
            </div>
   </div>

        <div class="bloque">
            <span>Edad:</span><br>
            <input type="number" id="edad" min="0"><br>
        </div>

        
      <div class="bloque">
          <span>Nivel de actividad: </span><br>
            <select name="actividad" id="actividad">
                <option value="1">Sedentario</option>'
                <option value="2">Actividad ligera</option>
                <option value="3">Actividad moderada</option>
                <option value="4">Actividad intensa</option>
                <option value="5">Actividad muy intensa</option>
            </select>
      </div>
      <div class="bloque">
          <button id="enviar">Enviar</button>
      </div>
      <div class="azul">
            <span id="result">
                Tu tasa metabolica basal es de: 
             </span>
      </div>
            

    </div>
    <script src="main.js"></script>
</body>
</html>
